<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clive</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="data:,">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <div id="app" class="state-idle">
    <div id="ambient-glow"></div>

    <!-- Top bar -->
    <header id="topbar">
      <div id="identity">
        <div id="orb">
          <div id="orb-ring"></div>
          <div id="orb-core"></div>
          <div id="orb-pulse"></div>
        </div>
        <span id="brand-label">Clive</span>
        <span id="state-label">ready</span>
      </div>
      <div id="topbar-right">
        <span id="clock-display">--:--</span>
        <span id="connection-dot"></span>
        <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat thread -->
    <main id="chat" role="log" aria-label="Conversation">
      <div id="chat-empty">
        <span>How can I help?</span>
      </div>
      <div id="chat-inner"></div>
    </main>

    <!-- Input bar -->
    <div id="input-bar">
      <button id="btn-push-to-talk" class="mic-btn" type="button" aria-label="Hold to talk">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <input id="text-input" type="text" placeholder="Message Clive…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
      <button id="btn-text-send" class="send-btn" type="button" aria-label="Send">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <!-- Voice overlay: full-screen mode during voice turns -->
    <div id="voice-overlay" class="hidden">
      <div id="waveform">
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
      </div>
      <div id="voice-label">Listening</div>
      <div id="voice-task"></div>
      <button id="btn-voice-cancel" type="button" aria-label="Cancel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Settings overlay -->
    <div id="settings-panel" class="overlay hidden" aria-hidden="true">
      <div id="settings-backdrop" class="overlay-backdrop"></div>
      <div class="overlay-sheet">
        <div class="overlay-header">
          <h2>Settings</h2>
          <button id="btn-close-settings" class="icon-btn" type="button" aria-label="Close settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <div class="settings-group">
          <div class="settings-group-label">Interaction</div>

          <label class="setting-row">
            <div class="setting-info">
              <div class="setting-name">Auto-listen after speaking</div>
              <div class="setting-desc">Reopen the mic after Clive finishes a response.</div>
            </div>
            <input id="setting-auto-listen" type="checkbox" checked>
          </label>

          <label class="setting-row">
            <div class="setting-info">
              <div class="setting-name">Speech barge-in</div>
              <div class="setting-desc">Interrupt Clive by speaking over him.</div>
            </div>
            <input id="setting-barge-in" type="checkbox" checked>
          </label>

          <label class="setting-row">
            <div class="setting-info">
              <div class="setting-name">Reply timeout</div>
              <div class="setting-desc">How long to wait for you after Clive speaks.</div>
            </div>
            <select id="setting-auto-listen-timeout" class="setting-select">
              <option value="3000">3s</option>
              <option value="5000" selected>5s</option>
              <option value="8000">8s</option>
            </select>
          </label>

          <label class="setting-row">
            <div class="setting-info">
              <div class="setting-name">Voice responses (TTS)</div>
              <div class="setting-desc">Speak responses aloud. Disable for text-only mode.</div>
            </div>
            <input id="setting-tts-enabled" type="checkbox" checked>
          </label>
        </div>

        <div class="settings-group">
          <div class="settings-group-label">Display</div>

          <label class="setting-row">
            <div class="setting-info">
              <div class="setting-name">Ambient motion</div>
              <div class="setting-desc">Animate the orb and background glow.</div>
            </div>
            <input id="setting-ambient-motion" type="checkbox" checked>
          </label>

          <label class="setting-row">
            <div class="setting-info">
              <div class="setting-name">Large text</div>
              <div class="setting-desc">Bigger text for wall displays or across-room viewing.</div>
            </div>
            <input id="setting-large-text" type="checkbox">
          </label>
        </div>

        <div class="settings-group">
          <div class="settings-group-label">System</div>
          <div class="status-rows">
            <div class="status-row"><span>Mode</span><span id="metric-mode">Idle</span></div>
            <div class="status-row"><span>Wake word</span><span id="metric-wake-word">Push-to-talk</span></div>
            <div class="status-row"><span>Audio</span><span id="metric-audio">Ready</span></div>
            <div class="status-row"><span>Agent</span><span id="host-agent-id">clive</span></div>
            <div class="status-row"><span>Agent health</span><span id="host-agent-health">Checking</span></div>
            <div class="status-row"><span>Last heard</span><span id="host-last-transcript">Waiting</span></div>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-label" style="color: var(--error);">Hardware Rescue</div>
          <button id="btn-exit-kiosk" class="settings-btn" type="button" style="border-color: rgba(192,64,64,0.4); color: var(--error);">Exit Kiosk Mode</button>
        </div>
      </div>
    </div>

    <!-- Confirmation dialog -->
    <div id="confirmation" class="hidden">
      <div id="confirm-message"></div>
      <div id="confirm-buttons">
        <button id="btn-confirm" class="confirm-btn confirm-yes" type="button">Proceed</button>
        <button id="btn-deny" class="confirm-btn confirm-no" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script src="clive-config.js"></script>
  <script src="clive-ui.js"></script>
</body>
</html>
